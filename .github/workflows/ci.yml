name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the locked environment
        # --frozen: CI must fail if uv.lock has drifted from pyproject.toml rather than
        # silently re-resolving. The lockfile is the source of truth (§3.11).
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest tests/unit -v

      - name: Security tests
        # These are acceptance criteria (§9.4), not extras. Run them as their own step so a
        # failure here is unmistakable in the job summary.
        run: uv run pytest tests/security -v
