name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quanta
          POSTGRES_PASSWORD: quanta-test-only
          POSTGRES_DB: quanta_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quanta -d quanta_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QUANTA_TEST_DATABASE_URL: postgresql://quanta:quanta-test-only@localhost:5432/quanta_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the locked environment
        # --locked: CI must fail if uv.lock has drifted from pyproject.toml rather than
        # silently re-resolving. The lockfile is the source of truth (§3.11).
        run: uv sync --locked --extra dev --extra research

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest tests/unit -v

      - name: Security tests
        # These are acceptance criteria (§9.4), not extras. Run them as their own step so a
        # failure here is unmistakable in the job summary.
        run: uv run pytest tests/security -v

      - name: JavaScript syntax
        run: |
          node --input-type=module --check < src/quanta/web/static/app.js
          node --check src/quanta/web/static/product.mjs
          node --test tests/frontend.test.mjs

      - name: Installed wheel
        run: |
          uv build --wheel
          uv venv /tmp/quanta-installed
          uv pip install --python /tmp/quanta-installed/bin/python dist/*.whl
          cd /tmp
          /tmp/quanta-installed/bin/quanta analyze "$GITHUB_WORKSPACE/tests/fixtures/repos/no_crypto" --out /tmp/quanta-report

  service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start local service
        run: docker compose up --build -d --wait
      - name: Verify worker acquisition network boundary
        run: docker compose exec -T worker python - < scripts/check_worker_egress.py
      - name: Exercise worker and public repository flow
        run: python scripts/smoke_service.py --live
      - name: Container logs
        if: failure()
        run: docker compose logs --tail=60
      - name: Stop containers
        if: always()
        run: docker compose down -v
