[project]
name = "quanta"
version = "0.1.0"
description = "Cryptographic agility measurement and assisted post-quantum migration for Python repositories"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "libcst==1.8.6",
  "networkx>=3.6",
  # Upper bound is a hardware constraint, not a preference — see docs/adr/ADR-017.
  "cryptography>=48.0.0,<49",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.19",
  "jinja2>=3.1",
  "pydot>=3.0",
  "typer>=0.12",
  "httpx>=0.27",
  "structlog>=24.1",
]

[project.optional-dependencies]
research = [
  "pytest>=8",
  "hypothesis>=6.100",
  "coverage>=7.5",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "krippendorff>=0.6",
  "pandas>=2.2",
  "PyGithub>=2.3",
]
dev = ["ruff>=0.5", "mypy>=1.10", "pytest-cov>=5", "pytest>=8", "hypothesis>=6.100"]

[project.scripts]
quanta = "quanta.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quanta"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "RET", "SIM", "PTH", "RUF"]
ignore = [
  "S603", # subprocess call — every call site is argument-vector with shell=False by construction
]

[tool.ruff.lint.per-file-ignores]
# Security tests deliberately contain hostile strings and assertions about them.
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/quanta"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["networkx.*", "pydot.*", "libcst.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: tests that take more than a few seconds",
  "network: tests that require outbound network access",
]
