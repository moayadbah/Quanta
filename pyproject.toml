[project]
name = "quanta"
version = "0.3.0"
description = "Cryptographic agility measurement and assisted post-quantum migration for Python repositories"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "libcst==1.8.6",
  "networkx>=3.6",
  # Upper bound is a hardware constraint, not a preference — see docs/adr/ADR-017.
  "cryptography>=48.0.0,<49",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.19",
  "jinja2>=3.1",
  "pydot>=3.0",
  "typer>=0.12",
  "httpx[socks]>=0.27",
  "structlog>=24.1",
  "psycopg[binary]>=3.2,<4",
  "vercel>=0.10.0",
]

[project.optional-dependencies]
research = [
  "pytest>=8",
  "hypothesis>=6.100",
  "coverage>=7.5",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "krippendorff>=0.6",
  "pandas>=2.2",
  "PyGithub>=2.3",
]
dev = ["ruff>=0.5", "mypy>=1.10", "pytest-cov>=5", "pytest>=8", "hypothesis>=6.100"]

[project.scripts]
quanta = "quanta.cli:app"

[tool.vercel]
entrypoint = "api.index:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quanta"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Synthetic target repositories. This is deliberately flawed sample code standing in for
# a repository under analysis — weak hashes and hard-coded algorithms are the fixture's
# whole purpose, so linting it as if it were ours is meaningless noise. demo/repos holds
# the same program written three ways, and its architecture is the thing being measured.
extend-exclude = ["tests/fixtures/repos", "demo/repos"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "RET", "SIM", "PTH", "RUF"]
ignore = [
  "S603",   # subprocess call — every call site is argument-vector with shell=False by construction
  "RUF002", # docstrings quote the specification's mathematical notation (×, −, ≈, ₁, ‖)
]

[tool.ruff.lint.per-file-ignores]
# Security tests deliberately contain hostile strings and assertions about them.
# PTH211: os.symlink is the clearest way to build a hostile link fixture.
"tests/**" = ["S101", "S105", "S106", "S108", "PTH211"]
# RUF001/RUF003 flag ambiguous unicode. In this file the homoglyphs ARE the test — it
# asserts that Cyrillic look-alike hosts and repo names are rejected.
"tests/security/test_url_shapes.py" = ["S101", "RUF001", "RUF003"]
# N818 wants an "Error" suffix, but §9.1 names these exceptions Reject and Truncated and
# they are referenced by those names throughout the documentation.
"src/quanta/errors.py" = ["N818"]
# LibCST dispatches on method names of the form visit_<NodeType>/leave_<NodeType>. N802
# (lowercase function names) cannot be satisfied without breaking the framework contract.
"src/quanta/core/detect.py" = ["N802", "N818"]
"src/quanta/engines/**" = ["N802"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/quanta"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["networkx.*", "pydot.*", "libcst.*", "scipy.*", "krippendorff.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: tests that take more than a few seconds",
  "network: tests that require outbound network access",
]

[tool.hatch.build.targets.wheel.force-include]
"config" = "quanta/data/config"
"templates" = "quanta/data/templates"
"demo" = "quanta/data/demo"
"tests/fixtures/xwing_draft10_vectors.json" = "quanta/data/tests/fixtures/xwing_draft10_vectors.json"
