<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Quanta</title>
  <link rel="icon" href="brand/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="site.css">
  <script type="module" src="page.mjs"></script>
</head>
<body data-title-key="privacy.title">
  <a class="skip" href="#main" data-t="a11y.skip"></a>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/" data-t-attr="aria-label=brand.home">
        <img src="brand/logo.svg" alt="" width="24" height="24">
        <span data-t="brand.name"></span>
      </a>
      <nav class="nav" data-t-attr="aria-label=nav.label">
        <a href="/" data-t="nav.home"></a>
        <a href="/workspace.html" data-t="nav.workspace"></a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" type="button" data-action="language" data-t-attr="aria-label=lang.switch_label;title=lang.switch_label">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="8" cy="8" r="6.25"/><path d="M1.75 8h12.5M8 1.75c1.8 1.9 2.6 4 2.6 6.25S9.8 12.35 8 14.25M8 1.75C6.2 3.65 5.4 5.75 5.4 8s.8 4.35 2.6 6.25"/></svg>
        </button>
        <a class="btn primary sm" href="/workspace.html" data-t="cta.open"></a>
      </div>
    </div>
  </header>
  <main id="main" class="page">
    <a class="back" href="/"><svg class="arrow back-arrow" viewBox="0 0 12 12" aria-hidden="true"><path d="M10 6H2.5M5.5 3 2.5 6l3 3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="privacy.back"></span></a>
    <h1 class="h1" data-t="privacy.heading"></h1>
    <p class="lede" data-t="privacy.intro"></p>
    <h2 class="h3" data-t="privacy.signin_title"></h2>
    <p data-t="privacy.signin_body"></p>
    <h2 class="h3" data-t="privacy.stored_title"></h2>
    <p data-t="privacy.stored_body"></p>
    <h2 class="h3" data-t="privacy.retention_title"></h2>
    <p data-t="privacy.retention_body"></p>
    <h2 class="h3" data-t="privacy.processing_title"></h2>
    <p data-t="privacy.processing_body"></p>
    <h2 class="h3" data-t="privacy.controls_title"></h2>
    <p data-t="privacy.controls_body"></p>
    <div class="actions">
      <a class="btn sm" href="https://github.com/settings/applications" target="_blank" rel="noopener noreferrer" data-t="privacy.revoke_link"></a>
      <a class="btn sm" href="https://github.com/moayadbah/Quanta/issues" target="_blank" rel="noopener noreferrer" data-t="privacy.contact_link"></a>
    </div>
    <p class="small" data-t="privacy.no_tokens"></p>
    <h2 class="h3" data-t="privacy.analytics_title"></h2>
    <p data-t="privacy.analytics_body"></p>
    <p class="small" data-t="privacy.updated"></p>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <span class="brand"><img src="brand/logo.svg" alt="" width="24" height="24"><span data-t="brand.name"></span></span>
      <nav data-t-attr="aria-label=footer.label">
        <a href="/" data-t="nav.home"></a>
        <a href="/workspace.html" data-t="cta.open"></a>
        <a href="/api/docs" data-t="footer.api"></a>
      </nav>
    </div>
  </footer>
</body>
</html>
