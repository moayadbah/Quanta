<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Quanta</title>
  <link rel="icon" href="brand/logo.svg" type="image/svg+xml">
  <link rel="preload" href="brand/horizon-hero.webp" as="image" media="(min-width: 701px)">
  <link rel="stylesheet" href="site.css">
  <script type="module" src="landing.mjs"></script>
</head>
<body data-title-key="site.title">
  <a class="skip" href="#main" data-t="a11y.skip"></a>

  <header class="site-header overlay">
    <div class="wrap">
      <a class="brand" href="/" data-t-attr="aria-label=brand.home">
        <img src="brand/logo.svg" alt="" width="24" height="24">
        <span data-t="brand.name"></span>
      </a>
      <nav class="nav" data-t-attr="aria-label=nav.label">
        <a href="#product" data-t="nav.product"></a>
        <a href="#readiness" data-t="nav.readiness"></a>
        <a href="#numbers" data-t="nav.numbers"></a>
        <a href="#faq" data-t="nav.faq"></a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" type="button" data-action="language" data-t-attr="aria-label=lang.switch_label;title=lang.switch_label">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="8" cy="8" r="6.25"/><path d="M1.75 8h12.5M8 1.75c1.8 1.9 2.6 4 2.6 6.25S9.8 12.35 8 14.25M8 1.75C6.2 3.65 5.4 5.75 5.4 8s.8 4.35 2.6 6.25"/></svg>
        </button>
        <a class="btn primary sm hide-mobile" href="/workspace.html" data-t="cta.open"></a>
        <button class="icon-btn menu-button" id="menu-open" type="button" data-t-attr="aria-label=menu.open">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 5.5h11M2.5 10.5h11"/></svg>
        </button>
      </div>
    </div>
  </header>

  <dialog class="mobile-menu" id="mobile-menu" data-t-attr="aria-label=menu.label">
    <div class="menu-top">
      <span class="brand"><img src="brand/logo.svg" alt="" width="24" height="24"><span data-t="brand.name"></span></span>
      <button class="btn ghost sm" id="menu-close" type="button" data-t="menu.close"></button>
    </div>
    <nav>
      <a href="#product" data-t="nav.product"></a>
      <a href="#readiness" data-t="nav.readiness"></a>
      <a href="#numbers" data-t="nav.numbers"></a>
      <a href="#faq" data-t="nav.faq"></a>
      <a href="/workspace.html" data-t="cta.open"></a>
      <button type="button" data-action="language" data-t="lang.switch"></button>
    </nav>
  </dialog>

  <main id="main">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-media" id="hero-media">
        <picture>
          <source media="(max-width: 700px)" srcset="brand/horizon-hero-mobile.webp">
          <img id="hero-image" src="brand/horizon-hero.webp" alt="" width="1920" height="1270" fetchpriority="high">
        </picture>
        <canvas class="hero-ascii" id="hero-ascii" aria-hidden="true"></canvas>
      </div>
      <div class="hero-scrim" aria-hidden="true"></div>
      <div class="wrap hero-copy">
        <h1 class="display" id="hero-title" data-t="hero.title"></h1>
        <p class="lede" data-t="hero.lede"></p>
        <div class="actions">
          <a class="btn primary lg" href="/workspace.html"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span data-t="cta.scan"></span><svg class="arrow" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 9 9 3M4 3h5v5" stroke="currentColor" stroke-width="1.5" fill="none"/></svg></a>
          <a class="btn lg" href="/workspace.html#sample" data-t="cta.sample"></a>
        </div>
      </div>
    </section>

    <section class="section" id="product" aria-labelledby="product-title">
      <div class="wrap">
        <div class="section-head reveal">
          <h2 class="h2" id="product-title" data-t="product.title"></h2>
          <p class="lede" data-t="product.lede"></p>
        </div>
        <div class="pillars reveal-group">
          <article class="pillar reveal">
            <span class="num">01</span>
            <h3 class="h3" data-t="product.find_title"></h3>
            <p class="body" data-t="product.find_body"></p>
            <div class="shot surface" id="shot-find" role="img" data-t-attr="aria-label=product.find_title"><span class="sk sk-line "></span><span class="sk sk-line "></span><span class="sk sk-line "></span><span class="sk sk-line "></span><span class="sk sk-line "></span><span class="sk sk-line "></span><span class="sk sk-line short"></span></div>
          </article>
          <article class="pillar reveal">
            <span class="num">02</span>
            <h3 class="h3" data-t="product.change_title"></h3>
            <p class="body" data-t="product.change_body"></p>
            <div class="shot surface" id="shot-change" role="img" data-t-attr="aria-label=product.change_title"><span class="sk sk-line mid"></span><span class="sk sk-line "></span><span class="sk sk-line "></span><span class="sk sk-line short"></span></div>
          </article>
          <article class="pillar reveal">
            <span class="num">03</span>
            <h3 class="h3" data-t="product.ready_title"></h3>
            <p class="body" data-t="product.ready_body"></p>
            <div class="shot surface" id="shot-ready" role="img" data-t-attr="aria-label=product.ready_title"><span class="sk sk-line short"></span><span class="sk sk-line mid"></span><span class="sk sk-line "></span><span class="sk sk-line "></span></div>
          </article>
        </div>
      </div>
    </section>

    <section class="section" id="readiness" aria-labelledby="readiness-title">
      <div class="wrap">
        <div class="section-head reveal">
          <h2 class="h2" id="readiness-title" data-t="readiness.title"></h2>
          <p class="lede" data-t="readiness.lede"></p>
        </div>
        <div class="timeline-scroll reveal">
          <div class="timeline" id="timeline" role="group" data-t-attr="aria-label=readiness.timeline_label"><div class="tl-sk head"></div><div class="tl-sk"><span class="sk sk-line"></span></div><div class="tl-sk"><span class="sk sk-line"></span></div><div class="tl-sk"><span class="sk sk-line"></span></div><div class="tl-sk"><span class="sk sk-line"></span></div><div class="tl-sk"><span class="sk sk-line"></span></div><div class="tl-sk"><span class="sk sk-line"></span></div></div>
        </div>
        <div class="source-panel surface" id="source-panel" aria-live="polite"><span class="sk sk-line short"></span><span class="sk sk-line mid"></span><span class="sk sk-line mid"></span><span class="sk sk-line mid"></span><span class="sk sk-line short"></span><span class="sk sk-line short"></span></div>
      </div>
    </section>

    <section class="section" id="numbers" aria-labelledby="numbers-title">
      <div class="wrap">
        <div class="section-head reveal">
          <h2 class="h2" id="numbers-title" data-t="numbers.title"></h2>
          <p class="lede" data-t="numbers.lede"></p>
        </div>
        <div class="progress-grid">
          <article class="progress-card progress-baseline reveal" aria-labelledby="progress-baseline-title">
            <p class="progress-eyebrow" data-t="numbers.baseline.eyebrow"></p>
            <h3 id="progress-baseline-title" data-t="numbers.baseline.title"></h3>
            <p class="progress-intro" data-t="numbers.baseline.body"></p>
            <dl class="progress-metrics" id="progress-baseline-metrics"></dl>
            <h4 data-t="numbers.baseline.techniques"></h4>
            <ul class="progress-techniques">
              <li data-t="numbers.baseline.tech.1"></li>
              <li data-t="numbers.baseline.tech.2"></li>
              <li data-t="numbers.baseline.tech.3"></li>
              <li data-t="numbers.baseline.tech.4"></li>
              <li data-t="numbers.baseline.tech.5"></li>
            </ul>
          </article>
          <article class="progress-card progress-current reveal" aria-labelledby="progress-current-title">
            <p class="progress-eyebrow" data-t="numbers.current.eyebrow"></p>
            <h3 id="progress-current-title" data-t="numbers.current.title"></h3>
            <p class="progress-intro" data-t="numbers.current.body"></p>
            <dl class="progress-metrics" id="progress-current-metrics"></dl>
            <h4 data-t="numbers.techniques"></h4>
            <ul class="progress-techniques">
              <li data-t="numbers.current.tech.1"></li>
              <li data-t="numbers.current.tech.2"></li>
              <li data-t="numbers.current.tech.3"></li>
              <li data-t="numbers.current.tech.4"></li>
              <li data-t="numbers.current.tech.5"></li>
              <li data-t="numbers.current.tech.6"></li>
              <li data-t="numbers.current.tech.7"></li>
            </ul>
          </article>
        </div>
        <details class="progress-source">
          <summary data-t="numbers.progress.how"></summary>
          <p data-t="numbers.progress.method"></p>
          <ul id="progress-sources"></ul>
        </details>
        <div class="progress-measurements" aria-labelledby="progress-measured-title">
          <h3 class="h3" id="progress-measured-title" data-t="numbers.current.measured"></h3>
          <p class="progress-measured-note" data-t="numbers.current.note"></p>
          <div class="figures reveal-group" id="figures"></div>
          <div class="figure-detail surface" id="figure-detail" hidden></div>
          <p class="progress-scope" id="numbers-scope"></p>
          <details class="progress-source measurement-history">
            <summary data-t="numbers.history.title"></summary>
            <p data-t="numbers.history.note"></p>
            <table class="history-table">
              <caption class="sr-only" data-t="numbers.history.caption"></caption>
              <thead><tr>
                <th scope="col" data-t="numbers.history.metric"></th>
                <th scope="col" data-t="numbers.history.earlier"></th>
                <th scope="col" data-t="numbers.history.today"></th>
                <th scope="col" data-t="numbers.history.change"></th>
              </tr></thead>
              <tbody id="measurement-history"></tbody>
            </table>
            <p data-t="numbers.history.tradeoff"></p>
            <ul id="measurement-history-sources"></ul>
          </details>
        </div>
      </div>
    </section>

    <section class="section band" id="languages" aria-labelledby="languages-title">
      <div class="wrap split reveal">
        <h2 class="h2" id="languages-title" data-t="languages.title"></h2>
        <p class="lede" data-t="languages.lede"></p>
      </div>
    </section>

    <section class="section" id="faq" aria-labelledby="faq-title">
      <div class="wrap">
        <div class="section-head reveal">
          <h2 class="h2" id="faq-title" data-t="faq.title"></h2>
        </div>
        <div class="faq reveal">
          <details><summary><span data-t="faq.q1"></span><span class="plus" aria-hidden="true"></span></summary><p class="answer" data-t="faq.a1"></p></details>
          <details><summary><span data-t="faq.q2"></span><span class="plus" aria-hidden="true"></span></summary><p class="answer" data-t="faq.a2"></p></details>
          <details><summary><span data-t="faq.q3"></span><span class="plus" aria-hidden="true"></span></summary><p class="answer" data-t="faq.a3"></p></details>
          <details><summary><span data-t="faq.q4"></span><span class="plus" aria-hidden="true"></span></summary><p class="answer" data-t="faq.a4"></p></details>
          <details><summary><span data-t="faq.q5"></span><span class="plus" aria-hidden="true"></span></summary><p class="answer" data-t="faq.a5"></p></details>
          <details><summary><span data-t="faq.q6"></span><span class="plus" aria-hidden="true"></span></summary><p class="answer" data-t="faq.a6"></p></details>
          <details><summary><span data-t="faq.q7"></span><span class="plus" aria-hidden="true"></span></summary><p class="answer" data-t="faq.a7"></p></details>
          <details><summary><span data-t="faq.q8"></span><span class="plus" aria-hidden="true"></span></summary><p class="answer" data-t="faq.a8"></p></details>
        </div>
      </div>
    </section>

    <section class="section" aria-labelledby="close-title">
      <div class="wrap closing reveal">
        <h2 class="h2" id="close-title" data-t="close.title"></h2>
        <p class="lede" data-t="close.lede"></p>
        <div class="actions">
          <a class="btn primary lg" href="/workspace.html"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span data-t="cta.scan"></span><svg class="arrow" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 9 9 3M4 3h5v5" stroke="currentColor" stroke-width="1.5" fill="none"/></svg></a>
          <a class="btn lg" href="/workspace.html#sample" data-t="cta.sample"></a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span class="brand"><img src="brand/logo.svg" alt="" width="24" height="24"><span data-t="brand.name"></span></span>
      <nav data-t-attr="aria-label=footer.label">
        <a href="/workspace.html" data-t="cta.open"></a>
        <a href="/privacy.html" data-t="footer.privacy"></a>
        <a href="/references" data-t="footer.references"></a>
      </nav>
    </div>
  </footer>
</body>
</html>
