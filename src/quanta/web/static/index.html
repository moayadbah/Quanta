<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanta</title>
<!--
  No inline SCRIPT or STYLE element anywhere in this file. That is deliberate: it lets the
  Content-Security-Policy in app.py omit 'unsafe-inline', which is where most of CSP's
  value lives (ADR-020).

  No user-facing sentence is written here either. Every text node carries a data-i18n key
  and is filled from demo/content.json, so a missing Arabic string is a test failure
  rather than a blank panel during a presentation.
-->
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🔐</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <button id="brand" class="brand" type="button">
      <span class="brand-mark">Q</span>
      <span class="brand-text">
        <span class="brand-name">Quanta</span>
        <span class="brand-sub" data-i18n="ui.tagline"></span>
      </span>
    </button>
    <div class="topbar-actions">
      <button id="lang-toggle" class="ghost" type="button" data-i18n="ui.lang_button"></button>
      <button id="to-tool" class="ghost" type="button" data-i18n="ui.skip"></button>
    </div>
  </div>
</header>

<!-- ══ Guided walkthrough ═════════════════════════════════════════════════════ -->
<main id="walkthrough" class="wrap">

  <div class="act-rail">
    <ol id="act-dots" class="act-dots"></ol>
    <span id="act-counter" class="act-counter"></span>
  </div>

  <!-- Act 1 — the problem -->
  <section class="act" data-act="problem">
    <p class="eyebrow" data-i18n="acts.0.eyebrow"></p>
    <h1 data-i18n="acts.0.title"></h1>
    <p class="lead" data-i18n="acts.0.lead"></p>
    <div class="act-body">
      <div class="act-words">
        <p data-i18n-html="acts.0.body.0"></p>
        <p data-i18n-html="acts.0.body.1"></p>
        <p class="punch" data-i18n="acts.0.punch"></p>
      </div>
      <div class="act-visual" id="visual-problem"></div>
    </div>
  </section>

  <!-- Act 2 — inventory -->
  <section class="act hidden" data-act="inventory">
    <p class="eyebrow" data-i18n="acts.1.eyebrow"></p>
    <h1 data-i18n="acts.1.title"></h1>
    <p class="lead" data-i18n-html="acts.1.lead"></p>
    <div class="act-body">
      <div class="act-words">
        <p data-i18n-html="acts.1.body.0"></p>
        <p data-i18n-html="acts.1.body.1"></p>
        <p class="punch" data-i18n="acts.1.punch"></p>
      </div>
      <div class="act-visual" id="visual-inventory"></div>
    </div>
  </section>

  <!-- Act 3 — the CDG -->
  <section class="act hidden" data-act="cdg">
    <p class="eyebrow" data-i18n="acts.2.eyebrow"></p>
    <h1 data-i18n="acts.2.title"></h1>
    <p class="lead" data-i18n-html="acts.2.lead"></p>
    <div class="act-body">
      <div class="act-words">
        <p data-i18n-html="acts.2.body.0"></p>
        <p data-i18n-html="acts.2.body.1"></p>
        <p data-i18n-html="acts.2.body.2"></p>
        <p class="punch" data-i18n="acts.2.punch"></p>
        <div class="ledger">
          <div class="ledger-col ledger-built">
            <h3 data-i18n="act_cdg.built_title"></h3>
            <ul id="ledger-built"></ul>
          </div>
          <div class="ledger-col ledger-reused">
            <h3 data-i18n="act_cdg.reused_title"></h3>
            <ul id="ledger-reused"></ul>
          </div>
        </div>
      </div>
      <div class="act-visual" id="visual-cdg"></div>
    </div>
  </section>

  <!-- Act 4 — the minimum node cut -->
  <section class="act hidden" data-act="cut">
    <p class="eyebrow" data-i18n="acts.3.eyebrow"></p>
    <h1 data-i18n="acts.3.title"></h1>
    <p class="lead" data-i18n="acts.3.lead"></p>
    <div class="act-body act-body-wide">
      <div class="act-words">
        <p data-i18n-html="acts.3.body.0"></p>
        <p data-i18n-html="acts.3.body.1"></p>
        <p class="punch" data-i18n="acts.3.punch"></p>
        <p class="caveat" data-i18n-html="acts.3.note"></p>
      </div>
      <div class="act-visual">
        <div id="variant-tabs" class="variant-tabs"></div>
        <div id="visual-cut" class="cut-stage"></div>
        <div class="cut-controls">
          <button id="cut-toggle" class="primary" type="button" data-i18n="act_cut.press"></button>
          <span id="cut-status" class="muted small"></span>
        </div>
        <div id="variant-bars" class="variant-bars"></div>
      </div>
    </div>
  </section>

  <!-- Act 5 — verification -->
  <section class="act hidden" data-act="verify">
    <p class="eyebrow" data-i18n="acts.4.eyebrow"></p>
    <h1 data-i18n="acts.4.title"></h1>
    <p class="lead" data-i18n-html="acts.4.lead"></p>
    <div class="act-body">
      <div class="act-words">
        <p data-i18n-html="acts.4.body.0"></p>
        <p data-i18n-html="acts.4.body.1"></p>
        <p class="punch" data-i18n="acts.4.punch"></p>
      </div>
      <div class="act-visual" id="visual-verify"></div>
    </div>
  </section>

  <!-- Act 6 — hand over to the tool -->
  <section class="act hidden" data-act="try">
    <p class="eyebrow" data-i18n="acts.5.eyebrow"></p>
    <h1 data-i18n="acts.5.title"></h1>
    <p class="lead" data-i18n="acts.5.lead"></p>
    <div class="act-body">
      <div class="act-words">
        <p data-i18n-html="acts.5.body.0"></p>
        <p class="punch" data-i18n="acts.5.punch"></p>
        <button id="open-tool" class="primary" type="button" data-i18n="ui.skip"></button>
      </div>
      <div class="act-visual" id="visual-try"></div>
    </div>
  </section>

  <nav class="act-nav">
    <button id="act-back" class="ghost" type="button" data-i18n="ui.back"></button>
    <button id="act-next" class="primary" type="button" data-i18n="ui.next"></button>
  </nav>
  <p class="muted small centred" data-i18n="ui.glossary_hint"></p>
</main>

<!-- ══ The analyzer ═══════════════════════════════════════════════════════════ -->
<main id="tool" class="wrap hidden">

  <section id="screen-submit" class="screen">
    <h1 data-i18n="tool.title"></h1>
    <p class="lead muted" data-i18n="tool.lead"></p>

    <form id="submit-form" class="submit-row" autocomplete="off">
      <input id="repo-url" type="text" spellcheck="false" dir="ltr" data-i18n-placeholder="tool.placeholder">
      <button type="submit" class="primary" data-i18n="tool.analyze"></button>
    </form>
    <div id="submit-error" class="error hidden" role="alert"></div>

    <div class="examples">
      <div class="examples-head">
        <h3 data-i18n="tool.examples_title"></h3>
        <span class="muted small" data-i18n="tool.examples_note"></span>
      </div>
      <div id="example-list" class="example-grid"></div>
    </div>
  </section>

  <section id="screen-pipeline" class="screen hidden">
    <div class="run-head">
      <div>
        <h2 id="pipeline-repo"></h2>
        <div id="pipeline-sub" class="muted small"></div>
      </div>
      <button id="cancel-run" class="ghost" type="button" data-i18n="tool.start_over"></button>
    </div>
    <svg class="progress-track" viewBox="0 0 100 4" preserveAspectRatio="none" aria-hidden="true">
      <rect x="0" y="0" width="100" height="4" class="progress-bg"></rect>
      <rect id="progress-fill" x="0" y="0" width="0" height="4" class="progress-fill"></rect>
    </svg>
    <ol id="steps" class="steps"></ol>
  </section>

  <section id="screen-result" class="screen hidden">
    <div class="run-head">
      <div>
        <h2 id="result-repo"></h2>
        <div id="result-sub" class="muted small"></div>
      </div>
      <button id="new-run" class="ghost" type="button" data-i18n="tool.analyze_another"></button>
    </div>

    <div class="result-top">
      <div class="scorecard">
        <div id="score-value" class="score-value">—</div>
        <div class="score-of">/ 100</div>
        <div id="score-label" class="score-label"></div>
      </div>
      <div class="result-facts">
        <table class="mini wide">
          <thead>
            <tr>
              <th data-i18n="tool.factor_header"></th>
              <th data-i18n="tool.raw_header"></th>
              <th data-i18n="tool.formula_header"></th>
              <th class="num" data-i18n="tool.value_header"></th>
              <th class="num" data-i18n="tool.weight_header"></th>
              <th class="num" data-i18n="tool.points_header"></th>
            </tr>
          </thead>
          <tbody id="factor-rows"></tbody>
        </table>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="deductions" type="button" data-i18n="tool.tab_deductions"></button>
      <button class="tab" data-tab="trace" type="button" data-i18n="tool.tab_trace"></button>
      <button class="tab" data-tab="report" type="button" data-i18n="tool.tab_report"></button>
    </div>

    <div id="tab-deductions" class="tabpane">
      <div id="deductions"></div>
      <div id="recommendations"></div>
    </div>

    <div id="tab-trace" class="tabpane hidden">
      <ol id="result-steps" class="steps"></ol>
    </div>

    <div id="tab-report" class="tabpane hidden">
      <p class="muted small" data-i18n="tool.report_note"></p>
      <div class="downloads">
        <a id="dl-report" class="ghost" download="report.html" data-i18n="tool.download_report"></a>
        <a id="dl-score" class="ghost" download="score.json">score.json</a>
        <a id="dl-cdg" class="ghost" download="cdg.json">cdg.json</a>
        <a id="dl-meta" class="ghost" download="meta.json">meta.json</a>
      </div>
      <iframe id="report-frame" sandbox="" title="Quanta report"></iframe>
    </div>
  </section>
</main>

<!-- ══ Glossary popover ═══════════════════════════════════════════════════════ -->
<div id="glossary" class="glossary hidden" role="dialog" aria-modal="true">
  <div class="glossary-card">
    <button id="glossary-close" class="glossary-close" type="button" aria-label="Close">×</button>
    <h3 id="glossary-term"></h3>
    <p class="glossary-heading" data-i18n="ui.glossary_what"></p>
    <p id="glossary-what"></p>
    <p class="glossary-heading" data-i18n="ui.glossary_why"></p>
    <p id="glossary-why"></p>
    <p class="glossary-source"><span data-i18n="ui.glossary_source"></span> <code id="glossary-source"></code></p>
  </div>
</div>

<footer class="wrap muted small">
  <span id="footer-version"></span>
</footer>

<script src="/app.js" type="module"></script>
</body>
</html>
